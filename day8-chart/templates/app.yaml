apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cloudpulse-app
  template:
    metadata:
      labels:
        app: cloudpulse-app
    spec:
      containers:
      - name: cloudpulse-app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ["node", "server.js"]
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017/day8db"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloudpulse-service
spec:
  selector:
    app: cloudpulse-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
